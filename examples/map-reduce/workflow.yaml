name: map-reduce-demo
# Map/Reduce pattern: static foreach transform → aggregate (reduce)
#
# Execution flow:
#   1. transform — statically expanded into transform.0 / transform.1 / transform.2
#                  each receives one item ("alpha", "beta", "gamma") as input
#   2. aggregate — receives all transform outputs as a JSON array (reduce: json_array)
#
# The `foreach: "$[*]"` on `transform` tells Fluxion to fan out across the
# `input` array at parse time (static foreach).
# `input_from: transform` on `aggregate` collects every child output.

jobs:
  transform:
    component: ../../components/hello/target/wasm32-wasip1/debug/hello.wasm
    input: '["alpha", "beta", "gamma"]'
    foreach: "$[*]"

  aggregate:
    component: ../../components/hello/target/wasm32-wasip1/debug/hello.wasm
    depends_on: [transform]
    input_from: transform
    reduce: json_array
