[workspace]
members = [
    "crates/fluxion-cli",
    "crates/fluxion-core",
    "crates/fluxion-host",
    "crates/fluxion-worker",
]
exclude = ["components/hello", "components/file-reader", "components/network-probe", "components/pipeline-stage", "components/spin", "components/alloc-bomb", "components/python-hello", "components/sandbox-probe"]
resolver = "2"

[workspace.package]
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
anyhow     = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
tokio      = { version = "1", features = ["full"] }
tracing    = "0.1"
tracing-subscriber    = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-opentelemetry = "0.28"
opentelemetry         = "0.27"
opentelemetry_sdk     = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-stdout  = "0.27"
rusqlite   = { version = "0.31", features = ["bundled"] }
clap       = { version = "4", features = ["derive"] }
# Default features minus `cache` (wasmtime-cache -> zstd 0.13 carries RUSTSEC-2026-0391/0398/0403).
# fluxion has its own precompiled-component cache (fluxion-host/src/cache.rs) and never
# uses wasmtime's `Config::cache`.
wasmtime   = { version = "48", default-features = false, features = ["anyhow", "async", "backtrace", "gc", "gc-copying", "gc-drc", "gc-null", "wat", "profiling", "parallel-compilation", "cranelift", "pooling-allocator", "demangle", "addr2line", "coredump", "debug-builtins", "runtime", "component-model", "component-model-async", "threads", "stack-switching", "std", "debug", "compile-time-builtins", "wit-parser"] }
wasmtime-wasi = "48"
sha2          = "0.10"
lru           = "0.18"
axum          = "0.7"
reqwest       = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
bytes         = "1"
tokio-rustls  = "0.26"
rustls        = "0.23"
tower         = { version = "0.5", features = ["util"] }
hyper         = { version = "1", features = ["http1", "server"] }
hyper-util    = { version = "0.1", features = ["tokio"] }
futures       = "0.3"
base64        = "0.22"
assert_cmd    = "2"
predicates    = "3"
tempfile      = "3"
prometheus    = { version = "0.14", features = ["process"] }
cron              = "0.12"
chrono            = "0.4"
hickory-resolver  = "0.26"
notify            = "6"
criterion         = { version = "0.5", features = ["html_reports"] }
serde_json_path   = "0.7"
uuid              = { version = "1", features = ["v4"] }
dashmap           = "6"
