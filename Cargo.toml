[workspace]
members = [
    "crates/fluxion-cli",
    "crates/fluxion-core",
    "crates/fluxion-host",
    "crates/fluxion-worker",
]
exclude = ["components/hello", "components/file-reader", "components/network-probe", "components/pipeline-stage", "components/spin", "components/alloc-bomb", "components/python-hello", "components/sandbox-probe"]
resolver = "2"

[workspace.package]
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
anyhow     = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
tokio      = { version = "1", features = ["full"] }
tracing    = "0.1"
tracing-subscriber    = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-opentelemetry = "0.28"
opentelemetry         = "0.27"
opentelemetry_sdk     = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-stdout  = "0.27"
rusqlite   = { version = "0.31", features = ["bundled"] }
clap       = { version = "4", features = ["derive"] }
wasmtime   = { version = "36", features = ["component-model"] }
wasmtime-wasi = "36"
sha2          = "0.10"
lru           = "0.12"
axum          = "0.7"
reqwest       = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
bytes         = "1"
tokio-rustls  = "0.26"
rustls        = "0.23"
tower         = { version = "0.5", features = ["util"] }
hyper         = { version = "1", features = ["http1", "server"] }
hyper-util    = { version = "0.1", features = ["tokio"] }
futures       = "0.3"
base64        = "0.22"
assert_cmd    = "2"
predicates    = "3"
tempfile      = "3"
prometheus    = { version = "0.13", features = ["process"] }
cron              = "0.12"
chrono            = "0.4"
hickory-resolver  = "0.24"
notify            = "6"
criterion         = { version = "0.5", features = ["html_reports"] }
serde_json_path   = "0.7"
uuid              = { version = "1", features = ["v4"] }
dashmap           = "6"
