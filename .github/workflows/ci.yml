name: CI

on:
  push:
    branches: [master, main, "feat/**", "fix/**", "hotfix/**", "refactor/**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/*.md"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    if: github.event.pull_request.draft == false && github.actor != 'github-actions[bot]'
    uses: flipslidersand-labs/qa-workflows/.github/workflows/rust-test.yml@main
    with:
      # fluxion-host のユニットテストは Wasm コンポーネントが必要なため e2e job で実施
      test-args: "-p fluxion-core -p fluxion-cli -p fluxion-worker"
      clippy-args: "-p fluxion-core -p fluxion-cli -p fluxion-worker --all-targets"
      system-deps: "build-essential libssl-dev pkg-config"
      run-coverage: false

  e2e:
    if: github.event.pull_request.draft == false && github.actor != 'github-actions[bot]'
    runs-on: ${{ vars.GATE_RUNNER }}
    timeout-minutes: 30
    env:
      RUST_LOG: fluxion_host=debug,fluxion_core=debug
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip1,wasm32-wasip2
      - name: Install system deps
        run: |
          for i in 1 2 3; do sudo apt-get update && break || sleep 5; done
          sudo apt-get install -y build-essential libssl-dev pkg-config
      - name: Cache cargo (host + components)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-component
            target
            components/alloc-bomb/target
            components/file-reader/target
            components/hello/target
            components/network-probe/target
            components/pipeline-stage/target
            components/spin/target
          key: ${{ runner.os }}-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-e2e-
      - name: Install cargo-component
        run: |
          if ! command -v cargo-component &>/dev/null; then
            cargo install cargo-component --locked -j2
          fi
      - name: Install componentize-py
        run: pip install componentize-py
      - name: Build Wasm components
        run: |
          for comp in alloc-bomb file-reader hello pipeline-stage spin; do
            (cd components/$comp && cargo component build -j2)
          done
          (cd components/network-probe && cargo component build --target wasm32-wasip2 -j2)
      - name: Build host and CLI
        run: cargo build -p fluxion-host -p fluxion-cli -j2
      - name: E2E tests
        run: cargo test -p fluxion-host --test e2e --features ci -j2
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ github.run_id }}
          path: /tmp/fluxion-e2e-*/
          retention-days: 7
