name: CI

on:
  push:
    branches: [master, main, "feat/**", "fix/**", "hotfix/**", "refactor/**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/*.md"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-test:
    if: github.event.pull_request.draft == false && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --workspace -j2

      - name: Test
        run: cargo test --workspace -j2

  clippy:
    if: github.event.pull_request.draft == false && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  e2e:
    # PR のみ実行（feature branch push はスキップ → GitHub ホスト消費ゼロ）
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.actor != 'github-actions[bot]'
    runs-on: ${{ vars.ARC_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      RUST_LOG: fluxion_host=debug,fluxion_core=debug
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo (host + components)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-component
            target
            components/alloc-bomb/target
            components/file-reader/target
            components/hello/target
            components/network-probe/target
            components/pipeline-stage/target
            components/spin/target
          key: ${{ runner.os }}-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-e2e-

      - name: Install Wasm targets
        run: |
          rustup target add wasm32-wasip1
          rustup target add wasm32-wasip2

      - name: Install cargo-component
        run: |
          if ! command -v cargo-component &>/dev/null; then
            cargo install cargo-component --locked -j2
          fi

      - name: Build Wasm components
        run: |
          for comp in alloc-bomb file-reader hello pipeline-stage spin; do
            (cd components/$comp && cargo component build -j2)
          done
          (cd components/network-probe && cargo component build --target wasm32-wasip2 -j2)

      - name: Build host
        run: cargo build -p fluxion-host -j2

      - name: E2E tests
        run: cargo test -p fluxion-host --test e2e --features ci -j2

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ github.run_id }}
          path: /tmp/fluxion-e2e-*/
          retention-days: 7

  fmt:
    if: github.event.pull_request.draft == false && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format check
        run: cargo fmt --all -- --check
