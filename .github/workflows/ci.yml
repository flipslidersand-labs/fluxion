name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/*.md"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-test:
    if: github.event.pull_request.draft == false && github.actor != 'github-actions[bot]'
    runs-on: ${{ vars.GATE_RUNNER }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install system deps
        run: |
          for i in 1 2 3; do
            if sudo apt-get update; then
              break
            fi
            if [ "$i" -lt 3 ]; then
              sleep 5
            fi
          done
          sudo apt-get install -y build-essential libssl-dev pkg-config
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-build-test
      - name: Build
        run: cargo build --workspace -j2
      - name: Test
        # fluxion-host lib/e2e tests require Wasm components; run in the e2e job
        # (`--lib --test e2e --features ci`).
        run: cargo test -p fluxion-core -p fluxion-cli -p fluxion-worker -j2

  clippy:
    if: github.event.pull_request.draft == false && github.actor != 'github-actions[bot]'
    runs-on: ${{ vars.GATE_RUNNER }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install system deps
        run: |
          for i in 1 2 3; do
            if sudo apt-get update; then
              break
            fi
            if [ "$i" -lt 3 ]; then
              sleep 5
            fi
          done
          sudo apt-get install -y build-essential libssl-dev pkg-config
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-clippy
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  e2e:
    if: github.event.pull_request.draft == false && github.actor != 'github-actions[bot]'
    runs-on: ${{ vars.GATE_RUNNER }}
    timeout-minutes: 30
    env:
      RUST_LOG: fluxion_host=debug,fluxion_core=debug
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip1,wasm32-wasip2
      - name: Install system deps
        run: |
          for i in 1 2 3; do
            if sudo apt-get update; then
              break
            fi
            if [ "$i" -lt 3 ]; then
              sleep 5
            fi
          done
          sudo apt-get install -y build-essential libssl-dev pkg-config python3 python3-venv
      - name: Cache cargo (host + components)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-e2e
          workspaces: |
            .
            components/alloc-bomb
            components/file-reader
            components/hello
            components/network-probe
            components/pipeline-stage
            components/sandbox-probe
            components/spin
          cache-bin: true
      - name: Install cargo-component
        run: |
          if ! command -v cargo-component &>/dev/null; then
            cargo install cargo-component --locked -j2
          fi
      - name: Install componentize-py
        # Use a venv: works on runners without a global `pip` (e.g. arc-fluxion)
        # and avoids PEP 668 "externally-managed-environment" errors.
        run: |
          python3 -m venv "$RUNNER_TEMP/componentize-venv"
          "$RUNNER_TEMP/componentize-venv/bin/pip" install componentize-py
          echo "$RUNNER_TEMP/componentize-venv/bin" >> "$GITHUB_PATH"
      - name: Build Wasm components
        run: |
          for comp in alloc-bomb file-reader hello pipeline-stage sandbox-probe spin; do
            (cd components/$comp && cargo component build -j2)
          done
          (cd components/network-probe && cargo component build --target wasm32-wasip2 -j2)
      - name: Build host and CLI
        run: cargo build -p fluxion-host -p fluxion-cli -j2
      - name: E2E tests
        run: cargo test -p fluxion-host --lib --test e2e --test sandbox_regression --features ci -j2
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ github.run_id }}
          path: /tmp/fluxion-e2e-*/
          retention-days: 7

  fmt:
    if: github.event.pull_request.draft == false && github.actor != 'github-actions[bot]'
    runs-on: ${{ vars.GATE_RUNNER }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format check
        run: cargo fmt --all -- --check
