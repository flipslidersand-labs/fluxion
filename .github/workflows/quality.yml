name: Quality

on:
  push:
    branches: [master, main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    uses: flipslidersand-labs/qa-workflows/.github/workflows/rust-test.yml@main
    with:
      rust-version: "stable"
      test-args: "--workspace"
      clippy-args: "--workspace --all-targets"
      coverage-threshold: 60
