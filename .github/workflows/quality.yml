name: Quality

on:
  push:
    branches: [master, main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    # qa-workflows#8: rust-test.yml が PR coverage comment 機能のため
    # pull-requests: write を要求するようになった。呼び出し元が明示的に
    # 許可しないと startup_failure になる（default_workflow_permissions が
    # read のため）。
    permissions:
      contents: read
      pull-requests: write
    # #220: Test + coverage が原因不明のまま6時間ハングし GitHub Actions の
    # デフォルト上限で強制キャンセルされた実績があるため、暫定的に上限を
    # 設定してログを確実に取得できるようにする（原因調査は #220 側）。
    timeout-minutes: 15
    uses: flipslidersand-labs/qa-workflows/.github/workflows/rust-test.yml@main
    with:
      rust-version: "stable"
      test-args: "--workspace"
      clippy-args: "--workspace --all-targets"
      coverage-threshold: 60
