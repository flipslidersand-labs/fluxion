name: PR Health

on:
  schedule:
    # 毎日 09:00 JST (00:00 UTC) — stale判定
    - cron: '0 0 * * *'
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  stale:
    if: github.event_name == 'schedule'
    permissions:
      pull-requests: write
      issues: write
    # #241: pinned to a commit SHA (qa-workflows has no tags yet) so a
    # breaking change on qa-workflows main can't silently break this CI.
    # Bump deliberately: `gh api repos/flipslidersand-labs/qa-workflows/commits/main --jq .sha`
    uses: flipslidersand-labs/qa-workflows/.github/workflows/stale-pr.yml@d95297c6d2b2d9159e5eccd9c5296970eb7efbe3

  size-label:
    if: github.event_name == 'pull_request_target'
    permissions:
      contents: read
      pull-requests: write
    uses: flipslidersand-labs/qa-workflows/.github/workflows/size-label.yml@d95297c6d2b2d9159e5eccd9c5296970eb7efbe3
