name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "crates/fluxion-host/benches/**"
      - "crates/fluxion-host/src/**"
      - "crates/fluxion-core/src/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  bench:
    name: Criterion benchmarks
    runs-on: ${{ vars.GATE_RUNNER || 'ubuntu-latest' }}
    # #770: リポジトリの default_workflow_permissions が read のため、
    # Store benchmark results (gh-pages への push) には contents: write、
    # Comment benchmark results on PR (PR へのコメント投稿) には
    # pull-requests: write が要る。
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-component
        run: cargo install cargo-component --locked

      - name: Build hello component (bench fixture)
        run: cargo component build -p hello
        working-directory: components/hello

      - name: Compile benchmarks (no-run)
        run: cargo bench -p fluxion-host --no-run

      - name: Run benchmarks
        # #770: `| tee` は cargo bench 自体の終了コードをマスクするため、
        # pipefail 無しだと失敗しても green のまま bench-output.txt が空になり得る。
        run: |
          set -o pipefail
          cargo bench -p fluxion-host -- \
            --output-format bencher \
            | tee bench-output.txt

      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        if: github.event_name != 'pull_request'
        with:
          tool: cargo
          output-file-path: bench-output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          comment-on-alert: true
          alert-threshold: "150%"
          fail-on-alert: false

      - name: Comment benchmark results on PR
        uses: benchmark-action/github-action-benchmark@v1
        if: github.event_name == 'pull_request'
        with:
          tool: cargo
          output-file-path: bench-output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-always: true
          alert-threshold: "150%"
          fail-on-alert: false
